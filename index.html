<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457c5">
<title>THUGIRAA TRADERS</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#17202e;--mute:#5d6b7d;--line:#dbe1ea;--acc:#2457c5;--ok:#17803d;--warn:#b45309;--bad:#c8321e}
@media(prefers-color-scheme:dark){:root{--bg:#111620;--card:#1a2230;--ink:#eaf0f8;--mute:#9aa8bb;--line:#2b3647;--acc:#6b9bff;--ok:#4ade80;--warn:#fbbf24;--bad:#ef5a43}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:980px;margin:0 auto;padding:0 12px 100px}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
header b{font-size:18px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.mute{color:var(--mute);font-size:13px}
.stats{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.stats div{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:6px 12px}
.stats span{display:block;font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
button{font:inherit;min-height:38px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;white-space:nowrap}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:4px 10px;font-size:13px;min-height:30px}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
td input{width:90px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute)}
tr.grp td{background:var(--bg);font-weight:600;padding:8px 6px}
input.low{border-color:var(--warn);color:var(--warn)}
input.zero,input.over{border-color:var(--bad);color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.bill.cancelled{border-left:4px solid var(--bad)}.bill.active{border-left:4px solid var(--ok)}
.note{padding:10px 12px;border-radius:8px;margin:10px 0}
.note.err{background:rgba(200,50,30,.12);color:var(--bad)}.note.ok{background:rgba(23,128,61,.14);color:var(--ok)}
.login{max-width:360px;margin:12vh auto;display:grid;gap:10px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border-radius:99px;padding:7px 14px}
.chip i{font-style:normal;font-size:12px;background:var(--ok);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;padding:0;font-size:20px}
.step input{width:64px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid{display:grid;gap:8px;margin-top:8px}
ul.sel{margin:4px 0;padding-left:18px}
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  #app,#dlg{display:none!important}
  #printArea{display:block!important;padding:10mm;color:#000;font:13px/1.4 Arial,Helvetica,sans-serif}
  #printArea h1{font-size:22px;margin:0;text-align:center}
  #printArea .c{text-align:center;margin:2px 0}
  #printArea table{width:100%;min-width:0;border-collapse:collapse;margin:10px 0}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:4px 3px;color:#000}
  #printArea .r{text-align:right}
  #printArea .stamp{border:2px solid #000;text-align:center;font-weight:bold;font-size:18px;padding:4px;margin:8px 0}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<style id="pageStyle">@page{size:A5;margin:0}</style>
<div id="printArea"></div>
<script>
/* ===== SETTINGS =====
1) Create a NEW Firebase project, add a Web app, and paste its config below.
2) Authentication > Sign-in method: enable Email/Password. Add user admin@thugiraa.app with your admin password.
3) Firestore Database: create it, then paste these rules:
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function adm(){return request.auth!=null&&request.auth.token.email=='admin@thugiraa.app';}
 function rep(){return request.auth!=null&&exists(/databases/$(d)/documents/refs/$(request.auth.uid));}
 match /refs/{u}{allow read:if adm()||request.auth.uid==u;allow create,delete:if adm();allow update:if adm()||request.auth.uid==u;}
 match /products/{p}{allow read:if adm()||rep();allow create,delete:if adm();allow update:if adm()||rep();}
 match /offers/{o}{allow read:if adm()||rep();allow write:if adm();}
 match /meta/{m}{allow read:if adm()||rep();allow write:if adm()||(m=='counter'&&rep());}
 match /orders/{o}{allow read:if adm()||(rep()&&resource.data.repId==request.auth.uid);allow create:if adm()||rep();allow update:if adm()||(rep()&&resource.data.repId==request.auth.uid);}
}}
*/
const FIREBASE_CONFIG=null; // e.g. {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}
const ADMIN_EMAIL="admin@thugiraa.app",DOMAIN="@thugiraa.app",NAME="THUGIRAA TRADERS";
const REASONS=["Shop refused / not needed","Wrong item delivered","Damaged goods","Price issue","Ordered by mistake","Other"];

let S={products:[],orders:[],refs:[],offers:[],shop:{}},user=null,ready=false,unsubs=[],loginErr="",lrole="admin";
let tab="order",cart={},freeCart={},cat="",qs="",shopName="",shopAddr="",shopTel="",disc="",ret="",brep="",msg="",lastFree="";
let db,auth,auth2,F;
const $=s=>document.querySelector(s);
const money=n=>"Rs "+(+n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const fmt=n=>(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const note=(t,k)=>`<div class="note ${k}">${esc(t)}</div>`;
const prodById=id=>S.products.find(p=>p.id===id);
const cats=()=>[...new Set(S.products.map(p=>p.cat))].sort();
const err=x=>{msg=note("Error: "+x.message,"err");render(true);};

/* ===== OFFERS & TOTALS ===== */
function calcFree(){
  const m={};
  S.offers.forEach(o=>{const q=cart[o.buyPid]||0;if(q>0&&q>=o.n)m[o.freePid]=(m[o.freePid]||0)+(o.repeat?Math.floor(q/o.n):1)*o.m;});
  return m;
}
function allFree(){const m=calcFree();Object.entries(freeCart).forEach(([id,q])=>{if(q>0)m[id]=(m[id]||0)+q;});return m;}
function offerText(o){const b=prodById(o.buyPid),f=prodById(o.freePid);return "Buy "+o.n+" x "+(b?b.name:"?")+", get "+o.m+" x "+(f?f.name:"?")+" free"+(o.repeat?" (for every "+o.n+")":" (once)");}
function offerHint(p){return S.offers.filter(o=>o.buyPid===p.id).map(o=>{const f=prodById(o.freePid);return `<div class="mute" style="color:var(--ok)">Offer: buy ${o.n}, get ${o.m} ${esc(f?f.name:"?")} free${o.repeat?" (every "+o.n+")":""}</div>`;}).join("");}
function totals(){
  const L=S.products.filter(p=>cart[p.id]>0),gross=sum(L,p=>cart[p.id]*p.price),dp=Math.min(100,Math.max(0,+disc||0)),less=Math.round(gross*dp)/100,rt=Math.max(0,+ret||0);
  return {L,gross,dp,less,rt,total:Math.max(0,Math.round((gross-less-rt)*100)/100)};
}

/* ===== VIEWS ===== */
function loginHTML(){
  return `<div class="card login"><h2 style="margin:0">${NAME}</h2>
  <div class="seg"><button class="${lrole=="admin"?"on":""}" data-act="role" data-v="admin">Admin</button><button class="${lrole=="rep"?"on":""}" data-act="role" data-v="rep">Rep</button></div>
  ${lrole=="admin"?'<input id="lp" type="password" placeholder="Admin password">':'<input id="ln" placeholder="Rep ID" autocapitalize="none" autocorrect="off" spellcheck="false"><input id="lp" type="password" placeholder="Password">'}
  <button class="pri" data-act="login">Log in</button><div class="note err" style="${loginErr?"":"display:none"}" id="lerr">${esc(loginErr)}</div></div>`;
}

function statsHTML(){
  const P=S.products,act=S.orders.filter(o=>o.status=="active"),can=S.orders.filter(o=>o.status=="cancelled"),t0=new Date().setHours(0,0,0,0);
  const c=[["Items in stock",sum(P,p=>p.stock)+" pcs"],["Stock value (cost)",money(sum(P,p=>p.stock*p.cost))],["Sales today",money(sum(act.filter(o=>o.time>=t0),o=>o.total))],["Cancelled bills",can.length],["Lost / damaged",money(sum(can,o=>o.lost||0))]];
  return `<div class="stats">${c.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>`;
}

function stockHTML(){
  let h=`<div class="card"><b>Add new item</b><div class="grid">
  <input id="pc" list="cl" placeholder="Category (e.g. Files, Pencils, Polythene, Clay)"><datalist id="cl">${cats().map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <input id="pn" placeholder="Item name (e.g. Box file A4)">
  <div class="two"><input id="ps" type="number" inputmode="numeric" min="0" placeholder="Opening stock"><input id="pk" type="number" inputmode="decimal" step="0.01" placeholder="Cost price"></div>
  <div class="two"><input id="pb" type="number" inputmode="decimal" step="0.01" placeholder="Bill (selling) price"><input id="pm" type="number" inputmode="decimal" step="0.01" placeholder="MRP (optional)"></div>
  <button class="pri" data-act="addprod">Add item</button></div></div>
  <div class="card scroll"><table><thead><tr><th>Item</th><th>Stock</th><th>Add stock</th><th>Cost</th><th>Bill price</th><th>MRP</th><th></th></tr></thead><tbody>`,last="";
  S.products.forEach(p=>{
    if(p.cat!==last){h+=`<tr class="grp"><td colspan="7">${esc(p.cat)}</td></tr>`;last=p.cat;}
    const cl=p.stock==0?"zero":p.stock<=10?"low":"",I=(f,v,x)=>`<td><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="${f}" value="${v}" ${x||""}></td>`;
    h+=`<tr><td>${esc(p.name)}</td>${I("stock",p.stock,`class="${cl}"`)}<td><input type="number" min="0" placeholder="+ qty" data-id="${p.id}" data-f="add"></td>${I("cost",p.cost)}${I("price",p.price)}${I("mrp",p.mrp)}
    <td style="white-space:nowrap"><button class="sm" data-act="renprod" data-v="${p.id}">Rename</button> <button class="sm" data-act="delprod" data-v="${p.id}">Delete</button></td></tr>`;
  });
  return h+'</tbody></table></div><p class="mute">Changes save when you leave a field. Red = out of stock, orange = 10 or fewer left.</p>';
}

function billsHTML(){
  const adm=user.role==="admin",L=S.orders.slice(0,300);
  if(!L.length)return '<div class="card mute">No bills yet.</div>';
  return L.map(o=>`<div class="card bill ${o.status}">
    <div class="row"><b>Bill #${o.id}</b><span class="badge">${o.status=="active"?"Active":"Cancelled"}</span></div>
    <div class="mute">${new Date(o.time).toLocaleString()}, Rep: ${esc(o.rep)}, Shop: ${esc(o.shop)}</div>
    <ul class="sel">${o.items.map(i=>`<li>${esc(i.name)} x ${i.qty} ${i.free?'<b style="color:var(--ok)">FREE</b>':"@ "+money(i.price)+" = "+money(i.qty*i.price)}</li>`).join("")}</ul>
    <div class="row"><b>${money(o.total)}</b><span><button class="sm" data-act="print" data-v="${o.id}">Print invoice</button> <button class="sm" data-act="wa" data-v="${o.id}">WhatsApp</button> ${o.status=="active"?`<button class="sm" data-act="cancel" data-v="${o.id}">Cancel bill</button>`:""}</span></div>
    ${(o.less||o.ret)?`<div class="mute">Gross ${money(o.gross)}, Discount ${money(o.less)}, Return ${money(o.ret)}</div>`:""}
    ${o.status=="cancelled"?`<div class="mute">Reason: ${esc(o.reason)}${o.note?" - "+esc(o.note):""}<br>Returned to stock: ${sum(o.items,i=>i.back||0)} pcs. Lost / damaged: ${money(o.lost)}</div>`:""}
  </div>`).join("");
}

function repsHTML(){
  return `<div class="card"><b>Create rep login</b><div class="grid"><input id="rn" placeholder="Rep name"><input id="ri" placeholder="Rep ID (letters / numbers, used to log in)" autocapitalize="none"><input id="rp" placeholder="Password (min 6 characters)"><input id="rt" type="tel" placeholder="Rep phone (optional)"><button class="pri" data-act="addrep">Create rep</button></div>
  <div class="mute" style="margin-top:6px">A rep can log in only after you create the ID and password here. Press Remove to block a rep.</div></div>
  ${S.refs.map(r=>`<div class="card row"><span><b>${esc(r.name)}</b><br><span class="mute">ID: ${esc(r.id)}${r.phone?", Tel: "+esc(r.phone):""}</span></span><button class="sm" data-act="delrep" data-v="${esc(r.uid)}">Remove</button></div>`).join("")||'<div class="card mute">No reps yet.</div>'}`;
}

function offersHTML(){
  const opt=S.products.map(p=>`<option value="${p.id}">${esc(p.cat)}: ${esc(p.name)}</option>`).join("");
  return `<div class="card"><b>Create free-item offer</b><div class="grid">
  <label class="mute">When the bill has</label><select id="ofb">${opt}</select>
  <input id="ofn" type="number" inputmode="numeric" min="1" placeholder="Quantity needed, e.g. 12">
  <label class="mute">Give this free</label><select id="off">${opt}</select>
  <input id="ofm" type="number" inputmode="numeric" min="1" placeholder="Free quantity, e.g. 1">
  <label class="row" style="justify-content:flex-start"><input id="ofr" type="checkbox" checked style="width:22px;height:22px"> Repeat for every full quantity</label>
  <button class="pri" data-act="addoffer">Add offer</button></div></div>
  ${S.offers.map(o=>`<div class="card row"><span>${esc(offerText(o))}</span><button class="sm" data-act="deloffer" data-v="${o.id}">Delete</button></div>`).join("")||'<div class="card mute">No offers yet.</div>'}`;
}

function settingsHTML(){
  const adm=user.role==="admin",ph=adm?(S.shop.adminTel||""):(user.phone||"");
  return `<div class="card grid" style="max-width:380px"><b>My phone number</b><input id="mp" type="tel" placeholder="Phone number" value="${esc(ph)}"><button class="pri" data-act="savephone">Save phone</button><div class="mute">Printed as Tel next to Sales Person on your bills.</div></div>`
  +(adm?`<div class="card grid" style="max-width:380px"><b>Shop details on invoice</b><input id="sa" placeholder="Shop address" value="${esc(S.shop.addr||"")}"><input id="st" type="tel" placeholder="Shop phone" value="${esc(S.shop.tel||"")}"><button class="pri" data-act="saveshop">Save shop details</button></div>`:"")
  +`<div class="card grid" style="max-width:380px"><b>Change my password</b><input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (min 6)"><input id="np2" type="password" placeholder="Repeat new password"><button class="pri" data-act="chpass">Save password</button></div>`;
}

function sumHTML(){
  const T=totals(),F=Object.entries(allFree());
  if(!T.L.length&&!F.length)return '<span class="mute">No items selected yet. Tap + on an item.</span>';
  const R=(a,b,bold)=>`<div class="row" style="margin-top:2px">${bold?"<b>"+a+"</b><b>"+b+"</b>":"<span>"+a+"</span><span>"+b+"</span>"}</div>`;
  let h=`<ul class="sel">`+T.L.map(p=>`<li>${esc(p.name)} x ${cart[p.id]} @ ${money(p.price)} = ${money(cart[p.id]*p.price)}</li>`).join("")+"</ul>"
   +R("Gross total",money(T.gross))+(T.rt?R("Return amount","- "+money(T.rt)):"")+(T.less?R("Discount "+T.dp+"%","- "+money(T.less)):"")+R("Total value",money(T.total),true);
  if(F.length)h+='<div style="color:var(--ok);margin-top:6px"><b>Free items</b><ul class="sel">'+F.map(([id,q])=>`<li>${esc((prodById(id)||{name:id}).name)} x ${q} FREE</li>`).join("")+"</ul></div>";
  return h;
}

function plistHTML(){
  const s=qs.trim().toLowerCase(),list=S.products.filter(p=>(!cat||p.cat===cat)&&(!s||p.name.toLowerCase().includes(s)));
  if(!list.length)return '<span class="mute">No items found. Admin can add items in the Stock tab.</span>';
  return list.map(p=>{const q=cart[p.id]||0;return `<div class="prod"><div><b>${esc(p.name)}</b><div class="mute">${p.stock>0?"In stock: "+p.stock:"Out of stock"}, ${money(p.price)} each</div>${offerHint(p)}</div>
    <div class="step"><button data-act="dec" data-v="${p.id}" ${q?"":"disabled"}>-</button><input type="number" inputmode="numeric" min="0" data-id="${p.id}" data-f="qty" value="${q||""}" placeholder="0" class="${q>p.stock?"over":""}"><button data-act="inc" data-v="${p.id}" ${p.stock>0?"":"disabled"}>+</button></div></div>`;}).join("");
}

function orderHTML(){
  const adm=user.role==="admin",cn=c=>sum(S.products.filter(p=>p.cat===c),p=>cart[p.id]||0),E=Object.entries(freeCart).filter(([k,v])=>v>0);
  const chip=(v,l,n)=>`<button class="chip ${cat===v?"on":""}" data-act="cat" data-v="${esc(v)}">${esc(l)}${n?`<i>${n}</i>`:""}</button>`;
  return `<div class="card"><div class="grid" style="margin:0"><input data-f="shop" placeholder="Shop name" value="${esc(shopName)}"><input data-f="addr" placeholder="Shop address (optional)" value="${esc(shopAddr)}"><input data-f="tel" type="tel" placeholder="Shop phone (optional)" value="${esc(shopTel)}">
  ${adm?`<select data-f="brep"><option value="">Bill by: Admin</option>${S.refs.map(r=>`<option value="${esc(r.uid)}" ${brep==r.uid?"selected":""}>Bill for rep: ${esc(r.name)}</option>`).join("")}</select>`:""}</div>
  <div class="chips">${chip("","All Items",0)}${cats().map(c=>chip(c,c,cn(c))).join("")}</div>
  <input data-f="qs" placeholder="Search item" value="${esc(qs)}"></div>
  <div class="card" id="plist">${plistHTML()}</div>
  <div class="card"><b>Add free items (optional)</b><div class="mute">Not charged, but stock is reduced.</div><div class="grid">
  <select id="fsel" data-f="fsel">${S.products.map(p=>`<option value="${p.id}" ${lastFree==p.id?"selected":""}>${esc(p.name)} (stock ${p.stock})</option>`).join("")}</select>
  <div class="row"><input id="fqty" type="number" inputmode="numeric" min="1" placeholder="Free quantity" style="flex:1"><button data-act="addfree">Add free</button></div></div>
  ${E.map(([id,q])=>`<div class="row" style="margin-top:8px"><span>${esc((prodById(id)||{name:id}).name)} x ${q} FREE</span><button class="sm" data-act="rmfree" data-v="${id}">Remove</button></div>`).join("")}</div>
  <div class="card"><b>Discount / Return (optional)</b><div class="two" style="margin-top:8px"><input data-f="disc" type="number" inputmode="decimal" min="0" max="100" step="0.01" placeholder="Discount %" value="${esc(disc)}"><input data-f="ret" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Return amount (Rs)" value="${esc(ret)}"></div></div>
  <div class="card" id="sum">${sumHTML()}</div><div class="bar"><div><span id="tot"></span><button class="pri" data-act="submit">Save bill</button></div></div>`;
}

function updateTot(){
  const el=$("#tot");if(!el)return;
  el.innerHTML=`<b>${money(totals().total)}</b> <span class="mute">${sum(S.products,p=>cart[p.id]||0)} pcs</span>`;
}

function render(force){
  const app=$("#app");
  if(!FIREBASE_CONFIG){app.innerHTML=`<div class="card login"><h2 style="margin:0">${NAME}</h2>`+note("Setup needed: paste your Firebase config into FIREBASE_CONFIG at the top of the script in index.html.","err")+"</div>";return;}
  if(!ready){app.innerHTML='<div class="card login mute">Loading...</div>';return;}
  const ae=document.activeElement;
  if(!force&&ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&app.contains(ae))return;
  if(!user){app.innerHTML=loginHTML();return;}
  const adm=user.role==="admin";
  const tabs=adm?[["order","New bill"],["stock","Stock"],["bills","Bills"],["reps","Reps"],["offers","Offers"],["settings","Settings"]]:[["order","New bill"],["bills","My bills"],["settings","Settings"]];
  app.innerHTML=`<header><b>${NAME}</b><span class="mute">${adm?"Admin":esc(user.name)}</span><button class="sm" data-act="logout">Log out</button></header>`
   +(adm?statsHTML():"")+`<nav>${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-act="tab" data-v="${k}">${l}</button>`).join("")}</nav>`+msg
   +(tab=="stock"?stockHTML():tab=="bills"?billsHTML():tab=="reps"?repsHTML():tab=="offers"?offersHTML():tab=="settings"?settingsHTML():orderHTML());
  updateTot();
}

/* ===== DATABASE ===== */
function listenErr(e){
  if(e.code==="permission-denied"&&user&&user.role==="rep"){loginErr="Your access was removed. Contact the admin.";auth.signOut();return;}
  msg=note("Connection problem: "+e.message,"err");render(true);
}
function startListening(){
  const adm=user.role==="admin";
  unsubs.push(db.collection("products").onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));render();},listenErr));
  unsubs.push(db.collection("offers").onSnapshot(s=>{S.offers=s.docs.map(d=>({id:d.id,...d.data()}));render();},listenErr));
  unsubs.push(db.doc("meta/shop").onSnapshot(d=>{S.shop=d.exists?d.data():{};render();},()=>{}));
  const q=adm?db.collection("orders").orderBy("time","desc").limit(500):db.collection("orders").where("repId","==",user.uid).limit(200);
  unsubs.push(q.onSnapshot(s=>{S.orders=s.docs.map(d=>d.data()).sort((a,b)=>b.time-a.time);render();},listenErr));
  if(adm)unsubs.push(db.collection("refs").onSnapshot(s=>{S.refs=s.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));render();},listenErr));
}

/* ===== ACTIONS ===== */
async function login(){
  loginErr="";const pw=$("#lp").value.trim(),email=lrole=="admin"?ADMIN_EMAIL:$("#ln").value.trim().toLowerCase()+DOMAIN;
  try{await auth.signInWithEmailAndPassword(email,pw);}
  catch(e){const el=$("#lerr");el.style.display="";el.textContent=e.code=="auth/network-request-failed"?"No internet connection.":lrole=="admin"?"Wrong admin password.":"Wrong Rep ID or password. Ask the admin to create your login.";}
}

async function submitOrder(){
  const rr=user.role==="admin"&&brep?S.refs.find(x=>x.uid===brep):null;
  const who=user.role==="admin"?(rr?{id:rr.uid,name:rr.name,tel:rr.phone||""}:{id:"admin",name:"Admin",tel:S.shop.adminTel||""}):{id:user.uid,name:user.name,tel:user.phone||""};
  const shop=shopName.trim(),lines=Object.entries(cart).filter(([k,v])=>v>0);
  if(!shop){msg=note("Enter the shop name.","err");render(true);return;}
  if(!lines.length){msg=note("Add at least one item quantity.","err");render(true);return;}
  const fr=allFree(),need={};
  lines.forEach(([id,q])=>{need[id]=(need[id]||0)+q;});
  Object.entries(fr).forEach(([id,q])=>{need[id]=(need[id]||0)+q;});
  try{
    const r=await db.runTransaction(async t=>{
      const cref=db.doc("meta/counter"),cs=await t.get(cref),ids=Object.keys(need);
      const snaps=await Promise.all(ids.map(id=>t.get(db.doc("products/"+id)))),P={};
      ids.forEach((id,i)=>{P[id]=snaps[i];});
      const bad=[];
      ids.forEach(id=>{const p=P[id].exists?P[id].data():null;if(!p||p.stock<need[id])bad.push((p?p.name:id)+": only "+(p?p.stock:0)+" in stock, needed "+need[id]);});
      if(bad.length)return {bad};
      const items=lines.map(([id,q])=>({pid:id,name:P[id].data().name,qty:q,price:P[id].data().price}));
      Object.entries(fr).forEach(([id,q])=>items.push({pid:id,name:P[id].data().name,qty:q,price:0,free:true}));
      ids.forEach(id=>t.update(P[id].ref,{stock:P[id].data().stock-need[id]}));
      const n=((cs.exists?cs.data().n:0)||0)+1,gross=sum(items,i=>i.qty*i.price),dp=Math.min(100,Math.max(0,+disc||0)),less=Math.round(gross*dp)/100,rt=Math.max(0,+ret||0);
      const total=Math.max(0,Math.round((gross-less-rt)*100)/100);
      t.set(db.doc("orders/"+n),{id:n,rep:who.name,repId:who.id,repTel:who.tel||"",shop,addr:shopAddr.trim(),tel:shopTel.trim(),time:Date.now(),items,gross,discPct:dp,less,ret:rt,total,status:"active"});
      t.set(cref,{n});
      return {ok:n};
    });
    if(r.bad)msg=note("Not enough stock. "+r.bad.join(" | "),"err");
    else{msg=`<div class="note ok">Bill #${r.ok} saved. <button class="sm" data-act="print" data-v="${r.ok}">Print invoice</button> <button class="sm" data-act="wa" data-v="${r.ok}">WhatsApp</button></div>`;
      cart={};freeCart={};shopName=shopAddr=shopTel=disc=ret="";tab="bills";}
  }catch(e){msg=note("Could not save the bill: "+e.message,"err");}
  render(true);
}

function openCancel(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  $("#dlg").innerHTML=`<h3 style="margin-top:0">Cancel bill #${o.id}</h3>
  <label class="mute">Reason</label><select id="cr">${REASONS.map(r=>`<option>${r}</option>`).join("")}</select>
  <label class="mute">Note (optional)</label><input id="cn">
  <p class="mute">How many pieces came back in good condition? The rest count as lost / damaged.</p>
  ${o.items.map((it,i)=>`<div class="row" style="margin:4px 0"><span>${esc(it.name)}${it.free?" (FREE)":""} (billed ${it.qty})</span><input type="number" min="0" max="${it.qty}" value="${it.qty}" data-back="${i}" style="width:80px"></div>`).join("")}
  <div class="row" style="margin-top:12px"><button data-act="close">Keep bill</button><button class="pri" data-act="docancel" data-v="${o.id}">Cancel bill</button></div>`;
  $("#dlg").showModal();
}

async function doCancel(id){
  const backs=[...document.querySelectorAll("[data-back]")].map(i=>Math.floor(+i.value||0)),reason=$("#cr").value,nt=$("#cn").value.trim();
  try{
    await db.runTransaction(async t=>{
      const oref=db.doc("orders/"+id),os=await t.get(oref);
      if(!os.exists||os.data().status!=="active")return;
      const o=os.data(),back={};
      o.items.forEach((it,i)=>{const b=Math.min(it.qty,Math.max(0,backs[i]||0));it.back=b;back[it.pid]=(back[it.pid]||0)+b;});
      const ids=Object.keys(back),ps=await Promise.all(ids.map(pid=>t.get(db.doc("products/"+pid))));
      ps.forEach((sn,i)=>{if(sn.exists&&back[ids[i]]>0)t.update(sn.ref,{stock:sn.data().stock+back[ids[i]]});});
      t.update(oref,{status:"cancelled",reason,note:nt,by:user.role==="admin"?"Admin":user.name,items:o.items,lost:sum(o.items,i=>(i.qty-i.back)*i.price)});
    });
    msg=note("Bill #"+id+" cancelled. Stock updated.","ok");
  }catch(e){msg=note("Could not cancel: "+e.message,"err");}
  $("#dlg").close();render(true);
}

async function addProduct(){
  const c=$("#pc").value.trim(),name=$("#pn").value.trim();
  if(!c||!name){msg=note("Enter the category and item name.","err");render(true);return;}
  if(S.products.some(p=>p.name.toLowerCase()===name.toLowerCase()&&p.cat.toLowerCase()===c.toLowerCase())){msg=note("This item already exists.","err");render(true);return;}
  const id="i"+Date.now().toString(36);
  try{await db.doc("products/"+id).set({id,cat:c,name,stock:Math.max(0,Math.floor(+$("#ps").value||0)),cost:+$("#pk").value||0,price:+$("#pb").value||0,mrp:+$("#pm").value||0});msg=note("Added "+name+".","ok");}
  catch(e){msg=note("Could not add: "+e.message,"err");}
  render(true);
}

async function addOffer(){
  const b=$("#ofb").value,f=$("#off").value,n=Math.floor(+$("#ofn").value),m=Math.floor(+$("#ofm").value);
  if(!(n>0)||!(m>0)){msg=note("Enter the quantity needed and the free quantity.","err");render(true);return;}
  try{await db.collection("offers").add({buyPid:b,freePid:f,n,m,repeat:$("#ofr").checked,created:Date.now()});msg=note("Offer added.","ok");}catch(e){msg=note(e.message,"err");}
  render(true);
}

async function addRep(){
  const n=$("#rn").value.trim(),id=$("#ri").value.trim().toLowerCase(),p=$("#rp").value.trim(),ph=$("#rt").value.trim();
  if(!n||!id||!p){msg=note("Enter the rep name, ID and password.","err");render(true);return;}
  if(!/^[a-z0-9._-]+$/.test(id)){msg=note("Rep ID can use only letters, numbers, dot, dash and underscore.","err");render(true);return;}
  if(p.length<6){msg=note("Password must be at least 6 characters.","err");render(true);return;}
  try{
    let uid;
    try{uid=(await auth2.createUserWithEmailAndPassword(id+DOMAIN,p)).user.uid;}
    catch(e){
      if(e.code!=="auth/email-already-in-use")throw e;
      try{uid=(await auth2.signInWithEmailAndPassword(id+DOMAIN,p)).user.uid;}catch(e2){throw new Error("That Rep ID already exists with a different password. Use a new Rep ID.");}
    }
    await db.doc("refs/"+uid).set({id,name:n,phone:ph});
    msg=note("Rep "+n+" is ready. Login ID: "+id,"ok");
  }catch(e){msg=note(e.message,"err");}
  try{await auth2.signOut();}catch(e){}
  render(true);
}

async function changePass(){
  const o=$("#op").value,n=$("#np").value.trim(),n2=$("#np2").value.trim();
  if(n.length<6){msg=note("New password must be at least 6 characters.","err");render(true);return;}
  if(n!==n2){msg=note("The two new passwords do not match.","err");render(true);return;}
  try{const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o));await u.updatePassword(n);msg=note("Password changed.","ok");}
  catch(e){msg=note(/credential|password/.test(e.code||"")?"Current password is wrong.":e.message,"err");}
  render(true);
}

/* ===== INVOICE / WHATSAPP ===== */
const invNo=o=>"TT/"+String(o.id).padStart(5,"0");
function grouped(o){const g={};o.items.forEach(i=>{const k=g[i.pid]=g[i.pid]||{name:i.name,price:null,q:0,f:0};if(i.free)k.f+=i.qty;else{k.q+=i.qty;k.price=i.price;}});return Object.values(g);}
function printBill(id){
  const o=S.orders.find(x=>x.id===id);if(!o){msg=note("Bill not found. Try again in a moment.","err");render(true);return;}
  const G=grouped(o),L=(a,b)=>`<div style="display:flex;justify-content:space-between;margin:2px 0"><span>${a}</span><span>${b}</span></div>`;
  $("#printArea").innerHTML=`<h1>${NAME}</h1><div class="c"><b>Sales Invoice</b></div>${S.shop.addr?`<div class="c">${esc(S.shop.addr)}</div>`:""}${S.shop.tel?`<div class="c">TEL: ${esc(S.shop.tel)}</div>`:""}
  ${o.status=="cancelled"?`<div class="stamp">CANCELLED${o.reason?" - "+esc(o.reason):""}</div>`:""}
  <div style="display:flex;justify-content:space-between;gap:10px;margin:12px 0 6px"><div style="width:50%"><div>Invoiced To:</div><b>${esc(o.shop)}</b>${o.addr?`<div>${esc(o.addr)}</div>`:""}${o.tel?`<div>Tel: ${esc(o.tel)}</div>`:""}</div>
  <div style="width:50%">${L("Invoice No",": "+invNo(o))}${L("Date",": "+new Date(o.time).toLocaleString())}${L("Sales Person",": "+esc(o.rep))}${L("Tel",": "+esc(o.repTel||""))}</div></div>
  <table><thead><tr><th>Description</th><th class="r">Price</th><th class="r">Qty</th><th class="r">Free</th><th class="r">Value</th></tr></thead><tbody>${G.map(k=>`<tr><td>${esc(k.name)}</td><td class="r">${k.price==null?"-":fmt(k.price)}</td><td class="r">${k.q}</td><td class="r">${k.f}</td><td class="r">${fmt(k.q*(k.price||0))}</td></tr>`).join("")}</tbody></table>
  <div style="width:55%;margin-left:auto">${L("Gross Total",fmt(o.gross))}${L("Return Amount",fmt(o.ret||0))}${L("Discount "+fmt(o.discPct||0)+"%",fmt(o.less||0))}<div style="border-top:2px solid #000;margin-top:4px;padding-top:3px;font-weight:bold;font-size:15px">${L("Total Value","Rs "+fmt(o.total))}</div></div>
  <div class="c" style="margin-top:14px">This is an autogenerated invoice. Thank you!</div>
  <div style="margin-top:36px;width:45%;border-top:1px solid #000;padding-top:2px">Customer Signature</div>`;
  setTimeout(()=>window.print(),80);
}
function shareWA(id){
  const o=S.orders.find(x=>x.id===id);if(!o){msg=note("Bill not found. Try again in a moment.","err");render(true);return;}
  let t=(o.status=="cancelled"?"*CANCELLED*\n":"")+"*"+NAME+"*\nSales Invoice\nInvoice No: "+invNo(o)+"\nDate: "+new Date(o.time).toLocaleString()+"\nShop: "+o.shop+"\nSales Person: "+o.rep+"\n------------------\n";
  grouped(o).forEach(k=>{t+=k.name+"\n   "+k.q+(k.f?" + "+k.f+" free":"")+" x "+(k.price==null?"-":fmt(k.price))+" = "+fmt(k.q*(k.price||0))+"\n";});
  t+="------------------\nGross: "+fmt(o.gross)+"\n"+(o.ret?"Return: "+fmt(o.ret)+"\n":"")+(o.less?"Discount "+fmt(o.discPct)+"%: "+fmt(o.less)+"\n":"")+"*TOTAL: Rs "+fmt(o.total)+"*"+(S.shop.tel?"\nTEL: "+S.shop.tel:"");
  let d=String(o.tel||"").replace(/\D/g,"");if(d.startsWith("0")&&d.length==10)d="94"+d.slice(1);
  window.open("https://wa.me/"+d+"?text="+encodeURIComponent(t),"_blank");
}

/* ===== EVENTS ===== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,keep=f=>{const y=scrollY;f();render(true);scrollTo(0,y);};
  if(a=="role"){lrole=v;loginErr="";render(true);}
  else if(a=="login")login();
  else if(a=="tab"){tab=v;msg="";render(true);}
  else if(a=="logout"){msg="";cart={};freeCart={};auth.signOut();}
  else if(a=="submit")submitOrder();
  else if(a=="cancel")openCancel(+v);
  else if(a=="docancel")doCancel(+v);
  else if(a=="close")$("#dlg").close();
  else if(a=="addrep")addRep();
  else if(a=="delrep"){if(confirm("Remove this rep? They will not be able to log in."))db.doc("refs/"+v).delete().catch(err);}
  else if(a=="chpass")changePass();
  else if(a=="addoffer")addOffer();
  else if(a=="deloffer"){if(confirm("Delete this offer?"))db.doc("offers/"+v).delete().catch(err);}
  else if(a=="addprod")addProduct();
  else if(a=="delprod"){const p=prodById(v);if(p&&confirm("Delete "+p.name+"? Old bills keep their record."))db.doc("products/"+v).delete().catch(err);}
  else if(a=="renprod"){const p=prodById(v),n=p&&prompt("New name:",p.name);if(n&&n.trim())db.doc("products/"+v).update({name:n.trim()}).catch(err);}
  else if(a=="savephone"){const p=$("#mp").value.trim(),w=user.role==="admin"?db.doc("meta/shop").set({adminTel:p},{merge:true}):db.doc("refs/"+user.uid).update({phone:p});
    w.then(()=>{if(user.role!=="admin")user.phone=p;msg=note("Phone number saved.","ok");render(true);}).catch(err);}
  else if(a=="saveshop")db.doc("meta/shop").set({addr:$("#sa").value.trim(),tel:$("#st").value.trim()},{merge:true}).then(()=>{msg=note("Shop details saved.","ok");render(true);}).catch(err);
  else if(a=="addfree"){const id=$("#fsel").value,q=Math.floor(+$("#fqty").value);if(!(q>0)){msg=note("Enter the free quantity.","err");render(true);return;}keep(()=>{freeCart[id]=(freeCart[id]||0)+q;lastFree=id;msg="";});}
  else if(a=="rmfree")keep(()=>{delete freeCart[v];});
  else if(a=="cat")keep(()=>{cat=v;});
  else if(a=="inc"||a=="dec")keep(()=>{cart[v]=Math.max(0,(cart[v]||0)+(a=="inc"?1:-1));});
  else if(a=="wa")shareWA(+v);
  else if(a=="print")printBill(+v);
});

document.addEventListener("change",e=>{
  const t=e.target,id=t.dataset.id,f=t.dataset.f;
  if(!id||!["stock","add","cost","price","mrp"].includes(f))return;
  const v=Math.max(0,+t.value||0),upd=f=="add"?{stock:F.increment(Math.floor(v))}:f=="stock"?{stock:Math.floor(v)}:{[f]:v};
  db.doc("products/"+id).update(upd).then(()=>{if(f=="add")t.value="";}).catch(err);
});

document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;
  if(f=="shop")shopName=t.value;
  else if(f=="addr")shopAddr=t.value;
  else if(f=="tel")shopTel=t.value;
  else if(f=="brep")brep=t.value;
  else if(f=="fsel")lastFree=t.value;
  else if(f=="qs"){qs=t.value;$("#plist").innerHTML=plistHTML();}
  else if(f=="disc"||f=="ret"){if(f=="disc")disc=t.value;else ret=t.value;updateTot();$("#sum").innerHTML=sumHTML();}
  else if(f=="qty"){
    const q=Math.max(0,Math.floor(+t.value||0)),p=prodById(t.dataset.id);
    cart[t.dataset.id]=q;t.classList.toggle("over",!!p&&q>p.stock);updateTot();$("#sum").innerHTML=sumHTML();
  }
});

/* ===== START ===== */
if(FIREBASE_CONFIG){
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();auth=firebase.auth();F=firebase.firestore.FieldValue;
  auth2=firebase.initializeApp(FIREBASE_CONFIG,"creator").auth(); // only used to create rep logins
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f());unsubs=[];user=null;S={products:[],orders:[],refs:[],offers:[],shop:{}};
    if(u){
      if(u.email===ADMIN_EMAIL)user={role:"admin",uid:u.uid};
      else{
        try{
          const d=await db.doc("refs/"+u.uid).get();
          if(d.exists)user={role:"rep",uid:u.uid,id:d.data().id,name:d.data().name,phone:d.data().phone||""};
          else{loginErr="This login has been removed by the admin.";await auth.signOut();}
        }catch(e){loginErr="Could not load your account. Check your internet.";await auth.signOut();}
      }
    }
    ready=true;
    if(user){tab="order";startListening();}
    render(true);
  });
}
render(true);
</script>
